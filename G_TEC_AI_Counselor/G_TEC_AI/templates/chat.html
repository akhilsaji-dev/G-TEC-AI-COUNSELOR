<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>G-TEC AI Counselor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #1c2e36, #295564, #448ba9);
      display: flex;
      justify-content: center;
      align-items: center;
    }
     

    /* ===== CHAT CONTAINER ===== */
    .chat-container {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      padding: 20px;
      text-align: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.3);
      letter-spacing: 1px;

    }

    .header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 5px;
    }

    /* ===== CHAT BOX ===== */
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Scrollbar */
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    /* ===== MESSAGE ===== */
    .message {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 15px;
      line-height: 1.6;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }

    /* USER */
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      border-bottom-right-radius: 5px;
    }

    /* BOT */
    .bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-bottom-left-radius: 5px;
    }

    /* ===== INPUT AREA ===== */
    .input-box {
      display: flex;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      gap: 10px;
    }

    /* TEXTAREA */
    textarea {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      resize: none;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    /* BUTTON */
    button {
      padding: 0 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    /* ===== BOT CONTENT STYLING ===== */
    .message.bot h3 {
      margin-top: 10px;
      color: #00eaff;
    }

    .message.bot ul,
    .message.bot ol {
      padding-left: 20px;
    }

    .message.bot li {
      margin-bottom: 5px;
    }

    .message.bot p {
      margin: 5px 0;
    }

    /* ===== ANIMATION ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      G-TEC AI Counselor
      <p> Powered by G-TEC AI LAB</p>
    </div>

    <p></p>
    <div class="chat-box">

      {% if user_message %}
      <div class="message user">
        {{ user_message }}
      </div>
      {% endif %}

      {% if response %}
      <div class="message bot">
        {{ response|safe }}
      </div>
      {% endif %}

    </div>

    <form method="POST" class="input-box">
      {% csrf_token %}
      <textarea name="message" placeholder="Ask about courses, career..." required></textarea>
      <button type="submit">➤</button>
    </form>
   

    <footer style="
  width:100%;
  text-align:center;
  padding:15px;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:#ccc;
  font-size:13px;
  backdrop-filter: blur(10px);
">
      <div style="margin-bottom:5px;">
         <b style="color:#6fe7f1;">G-TEC AI Counselor</b>
      </div>

      <div>
        © 2026 All Rights Reserved | Built with using Django
      </div>

      <div style="margin-top:5px; font-size:12px;">
        AI Courses • Career Guidance • Future Ready Skills
      </div>
    </footer>

  </div>

</body>

</html>
