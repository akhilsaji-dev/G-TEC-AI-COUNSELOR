    {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<link rel="icon" href="{% static 'images/logo.webp' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-TEC AI Counselor</title>

  

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<style>
    /* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: #e2e8f0;
}

/* NAVBAR */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 50px;

    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* LOGO */
.logo {
    font-size: 22px;
    font-weight: 600;
}

.logo span {
    color: #38bdf8;
}

/* NAV LINKS */
.nav-links a {
    margin-left: 25px;
    text-decoration: none;
    color: #cbd5f5;
    font-size: 14px;
    position: relative;
    transition: 0.3s;
}

/* underline animation */
.nav-links a::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    bottom: -5px;
    left: 0;
    background: #38bdf8;
    transition: 0.3s;
}

.nav-links a:hover::after {
    width: 100%;
}

.nav-links a:hover {
    color: #38bdf8;
}

/* LOGIN BUTTON */
.login-btn {
    padding: 8px 16px;
    border: 1px solid #38bdf8;
    border-radius: 6px;
}

.login-btn:hover {
    background: #38bdf8;
    color: black;
}

/* MAIN */
main {
    padding: 40px;
}

/* GLASS CARD (reuse everywhere) */
.card {
    background: rgba(255,255,255,0.05);
    padding: 25px;
    border-radius: 12px;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

/* SCROLLBAR (small but pro detail) */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-thumb {
    background: #38bdf8;
    border-radius: 10px;
}
</style>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo"><img src="{% static 'images/logo.webp' %}" alt="G-TEC AI Counselor Logo"></div>

    <nav class="nav-links">

        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/faq/">FAQ</a>

        {% if user.is_authenticated %}
            <a href="/counselor/">AI Chat</a>
            <a href="/logout/" class="login-btn">Logout</a>
        {% else %}
            <a href="/login/" class="login-btn">Login</a>
        {% endif %}

    </nav>
</header>
<!-- PAGE CONTENT -->
<main>
    {% block content %}{% endblock %}
</main>
<footer style="
  width:100%;
  text-align:center;
  padding:15px;
    background: linear-gradient(135deg, #0f172a, #020617);

  color:#ccc;
  font-size:13px;
  backdrop-filter: blur(10px);

">
    <div style="margin-bottom:5px;">
        <b style="color:#6fe7f1;">G-TEC AI Counselor</b>
    </div>

    <div>
        © 2026 All Rights Reserved | Built with using Django
    </div>

    <div style="margin-top:5px; font-size:12px;">
        AI Courses • Career Guidance • Future Ready Skills
    </div>
</footer>


</body>
</html>
