{% extends 'base.html' %}
{% block content %}
<style>
    .login-card {
        max-width: 400px;
        margin: 60px auto;
        text-align: center;
    }

    .login-form {
        margin-top: 20px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 15px;
    }

    .form-group label {
        font-size: 13px;
        color: #94a3b8;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
    }

    .btn {
        width: 100%;
        padding: 10px;
        background: #38bdf8;
        border: none;
        border-radius: 6px;
        margin-top: 10px;
        cursor: pointer;
        font-weight: 600;
    }

    .btn:hover {
        background: #0ea5e9;
    }
</style>
<div class="card login-card">
    <h2>Create Account</h2>
    <p class="subtitle">Start your AI career journey</p>

    {% if messages %}
    {% for message in messages %}
    <p style="color:red; margin-bottom:10px;">{{ message }}</p>
    {% endfor %}
    {% endif %}

    <form method="POST" class="login-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input name="username" type="text" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input name="password1" type="password" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input name="password2" type="password" required>
        </div>

        <button type="submit" class="btn">Create Account</button>
    </form>
    <br>

    <p class="extra-text">
        Already have an account? <a href="/login/">Login</a>
    </p>
</div>

{% endblock %}
