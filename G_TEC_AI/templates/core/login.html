{% extends 'base.html' %}
{% block content %}

<style>
    /* LOGIN CARD CENTER */
.login-card {
    max-width: 400px;
    margin: 60px auto;
    text-align: center;
}

/* FORM */
.login-form {
    margin-top: 20px;
}

.form-group {
    text-align: left;
    margin-bottom: 15px;
}

.form-group label {
    font-size: 13px;
    color: #94a3b8;
}

.form-group input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.08);
    color: #e2e8f0;
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 10px;
    background: #38bdf8;
    border: none;
    border-radius: 6px;
    margin-top: 10px;
    cursor: pointer;
    font-weight: 600;
}

.btn:hover {
    background: #0ea5e9;
}

/* EXTRA TEXT */
.extra-text {
    margin-top: 15px;
    font-size: 13px;
    color: #94a3b8;
}

.extra-text a {
    color: #38bdf8;
    text-decoration: none;
}
</style>
<div class="card login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue your journey</p>

    <form method="POST" class="login-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input name="username" type="text" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input name="password" type="password" required>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <p class="extra-text">
        Don't have an account? <a href="/register/">Register</a>
    </p>
</div>

{% endblock %}
